name: reconstruct player sprites

on:
  push:
    branches:
      - agent/player-sprite-billboard
    paths:
      - .github/workflows/reconstruct-player-sprites.yml
      - assets/player/player_idle_front.png.b64
      - assets/player/player_interact_front.png.b64
      - assets/player/player_walk_right.png.b64.part*

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: check out feature branch
        uses: actions/checkout@v7
      - name: reconstruct png assets
        shell: bash
        run: |
          base64 --decode assets/player/player_idle_front.png.b64 > assets/player/player_idle_front.png
          base64 --decode assets/player/player_interact_front.png.b64 > assets/player/player_interact_front.png
          cat assets/player/player_walk_right.png.b64.part* | base64 --decode > assets/player/player_walk_right.png
          file assets/player/player_idle_front.png assets/player/player_interact_front.png assets/player/player_walk_right.png
          rm assets/player/player_idle_front.png.b64
          rm assets/player/player_interact_front.png.b64
          rm assets/player/player_walk_right.png.b64.part*
      - name: commit reconstructed assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/player
          git diff --cached --quiet || git commit -m "add player billboard sprite assets"
          git push
